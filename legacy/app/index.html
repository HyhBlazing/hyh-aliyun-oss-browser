<!DOCTYPE html>
<html lang="zh-CN" ng-app="web" ng-controller="mainCtrl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1, maximum-scale=1, user-scalable=no, width=device-width" />
  <title>OSS Browser</title>
  <script>
    var path = require("path");
    var os = require("os");
    var fs = require("fs");
    var request = require("request");
    // var OSS = require('ali-oss');
    var custom = {};
    try {
      custom = require(path.join(__dirname, "../custom/index.js"));
    } catch (e) {
      console.log("没有自定义模块");
    }
    document.title = custom.title || "OSS Browser";
  </script>
  <!-- <link href="icons/icon.ico" rel="shortcut icon"/> -->
  <link href="css/lib.css" rel="stylesheet" />
  <link href="vendor/xgplayer-skin-default.css" rel="stylesheet" />
  <link href="app.css" rel="stylesheet" />
</head>

<body>
  <!-- <div ng-include="'main/_/loading.html'"></div>  -->
  <toast-list></toast-list>

  <div ui-view="">
    <!-- loading -->
    <section style="
          text-align: center;
          display: block;
          width: 128px;
          height: 120px;
          margin: 250px auto 0;
        ">
      <div class="loadEffect">
        <div><span></span></div>
        <div><span></span></div>
        <div><span></span></div>
        <div><span></span></div>
      </div>
    </section>
  </div>

  <!-- Insert this line above script imports  -->
  <script>
    if (typeof module === "object") {
      window.module = module;
      module = undefined;
    }
  </script>
  <script src="lib.js"></script>
  <script src="vendor/xgplayer.js"></script>
  <script src="vendor/xgplayer-flv.js"></script>

  <!-- Insert this line after script imports -->
  <script>
    if (window.module) module = window.module;
  </script>

  <script src="aliyun-sdk-oss.js"></script>
  <script src="templates.js"></script>
  <script>
    const { ipcRenderer, shell } = require("electron");
    var isDev = process.env.NODE_ENV == "development";

    ipcRenderer.on("asynchronous-reply", (event, data) => {
      switch (data.key) {
        case "getStaticServerPort":
          Global.staticServerPort = data.port;
          break;
      }
    });
    setTimeout(function () {
      ipcRenderer.send("asynchronous", { key: "getStaticServerPort" });
    }, 1000);

    //自动升级
    // setTimeout(function(){
    //   ipcRenderer.send('asynchronous-message', 'checkUpgrade');
    // },2000);
    // setInterval(function(){
    //   ipcRenderer.send('asynchronous-message', 'checkUpgrade');
    // },60000);

    function openExternal (url) {
      // Open a URL in the default way
      shell.openExternal(url);
    }
    function openLocaleFolder (p) {
      shell.showItemInFolder(p);
    }

    function openDevTools () {
      ipcRenderer.send("asynchronous", { key: "openDevTools" });
    }

    var pkg = require("./package");

    var Global = {
      //ossEndpointProtocol:'https:',
      app: {
        id: custom.appId || "oss-browser",
        logo: custom.logo_png || "icons/icon.png", //logo
        version: custom.version || pkg.version, //自定义版本号
      },
      i18n: require("./node/i18n"),
      config_path: path.join(os.homedir(), ".oss-browser"),
      about_html: custom.about_html,
    };
    (function () {
      if (!custom.appName) {
        return;
      }

      var zh = Global.i18n["zh-CN"];

      if (!zh || !zh.content) {
        return;
      }

      zh.content["app.name"] =
        typeof custom.appName === "string"
          ? custom.appName
          : custom.appName["zh-CN"] || "OSS浏览器";
    })();

    $(function () {
      $(document).on("dragover", function (ev) {
        ev.preventDefault();
        return false;
      });
      $(document).on("drop", function (ev) {
        ev.preventDefault();
        return false;
      });
    });

    //require('./node/crc64/test')
  </script>
  <script src="app.js"></script>
</body>

</html>
