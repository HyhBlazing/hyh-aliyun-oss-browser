[package]
name = "hyh-oss-browser"
version = "3.0.5"
description = "hyh-aliyun-oss-browser (Tauri)"
authors = ["HyhBlazing"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hyh_oss_browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
dirs = "6"
tauri-plugin-drag = "2.1.1"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4", features = ["std"] }
winreg = "0.55"
