<div class="modal-header">
  <button type="button" class="close" ng-click="cancel()">
    <span aria-hidden="true">&times;</span>
  </button>
  <h4 class="modal-title">
    <i class="fa fa-image"></i>
    <!-- 预览 -->
    {{'preview'|translate}}
    <span style="font-size: 80%;">({{objectInfo.size|sizeFormat}})</span>
  </h4>
</div>
<div class="modal-body pd0 preview-modal-body">
  <header class="preview-modal-path bg-success">
    oss://{{bucketInfo.bucket}}/{{objectInfo.path}}
  </header>

  <restore-checker
    bucket-info="bucketInfo"
    object-info="objectInfo"
    file-type="fileType"
    after-check-success="afterCheckSuccess()"
    after-restore-submit="afterRestoreSubmit()"
  >
    <div class="preview-modal-content text-center">
      <div ng-if="!imgsrc" is-loading></div>
      <img
        ng-if="imgsrc"
        ng-src="{{imgsrc}}"
        alt="{{'cannot.preview'|translate}}"
        class="preview-modal-image"
        ng-class="{'preview-modal-image--vector': fileType.ext[0]=='svg' || fileType.ext[0]=='ico'}"
      />
    </div>
  </restore-checker>
</div>
<div class="modal-footer">
  <span
    ng-if="previewBarVisible"
    ng-include="'main/files/modals/preview/preview-bar.html'"
  ></span>

  <button
    type="button"
    class="pull-right btn btn-default btn-sm"
    ng-click="cancel()"
  >
    <i class="glyphicon glyphicon-remove"></i>
    {{'close'|translate}}
  </button>
</div>
