<div class="modal-header">
  <button type="button" class="close" ng-click="cancel()">
    <span aria-hidden="true">&times;</span>
  </button>
  <h4 class="modal-title">
    <i class="fa fa-image"></i>
    <!-- 预览 -->
    {{'preview'|translate}}
    <span style="font-size: 80%;">({{objectInfo.size|sizeFormat}})</span>
  </h4>
</div>
<div class="modal-body pd0 preview-modal-body">
  <header class="preview-modal-path bg-success break">
    oss://{{bucketInfo.bucket}}/{{objectInfo.path}}
  </header>

  <restore-checker
    bucket-info="bucketInfo"
    object-info="objectInfo"
    file-type="fileType"
    after-check-success="afterCheckSuccess()"
    after-restore-submit="afterRestoreSubmit()"
  >
    <div class="preview-modal-content preview-modal-media text-center">
      <div ng-if="fileType.type=='audio' && !audioUrl" is-loading></div>

      <audio
        ng-if="fileType.type=='audio' && audioUrl"
        controls
        preload="metadata"
        autoplay
      >
        <source
          ng-src="{{audioUrl|trustAsResourceUrl}}"
          type="{{fileType.mimeType}}"
        />
      </audio>

      <xg-player
        ng-if="fileType.type=='video' && videoUrl"
        src="videoUrl"
        ext="{{fileType.ext[0]}}"
      ></xg-player>
    </div>
  </restore-checker>
</div>
<div class="modal-footer">
  <span
    ng-if="previewBarVisible"
    ng-include="'main/files/modals/preview/preview-bar.html'"
  ></span>

  <button
    type="button"
    class="pull-right btn btn-default btn-sm"
    ng-click="cancel()"
  >
    <i class="glyphicon glyphicon-remove"></i>
    {{'close'|translate}}
  </button>
</div>
